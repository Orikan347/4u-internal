name: Retired LINE functional real-driver channel (no artifact)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retired-channel:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Prove historical functional channel is deny-only
        shell: pwsh
        run: |
          python -m py_compile "Windows/source/line_auto_sender_windows_functional_test.pyw"
          $source = Get-Content -Raw "Windows/source/line_auto_sender_windows_functional_test.pyw"
          if (!$source.Contains('FUNCTIONAL_TEST_NO_AUTH = False')) { throw "Functional no-auth bypass was not retired" }
          if (!$source.Contains('WIN-FUNCTIONAL-RETIRED')) { throw "Direct dispatcher deny marker missing" }
          if ($source.Contains('FUNCTIONAL_TEST_NO_AUTH = True')) { throw "No-auth real-driver marker remains" }
          Write-Output "FUNCTIONAL_REAL_DRIVER_CHANNEL_RETIRED=PASS artifact_created=false"
