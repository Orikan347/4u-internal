name: Build private LINE Auto Sender Windows candidate

on:
  push:
    branches:
      - line-autosender-windows-private-8000-20260718
  workflow_dispatch:
    inputs:
      release_id:
        description: "Backend-registered DA-LINE-WINDOWS-YYYYMMDD-BUILD binding"
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  RELEASE_ID: "${{ inputs.release_id || 'DA-LINE-WINDOWS-20260717-8000' }}"

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Inject OAuth V2 release binding
        shell: pwsh
        run: |
          $releaseId = $env:RELEASE_ID
          if ($releaseId -notmatch '^DA-LINE-WINDOWS-[0-9]{8}-[0-9]+$') { throw "WIN-BUILD-RELEASE-001: invalid release_id" }
          $sourcePath = "src/LINE自動發訊息_Windows.pyw"
          python src/prepare_windows_release_binding.py $sourcePath $releaseId --bound-source release_binding/LINE自動發訊息_Windows.pyw --binding-output release_binding/BOUND_SOURCE_MANIFEST.json
          Copy-Item "src/gsheet_helper.py" "release_binding/gsheet_helper.py"

      - name: Verify Release Security allocation binds this exact source
        shell: pwsh
        run: |
          $evidencePath = "release_evidence/windows_release_security_allocation_20260718.json"
          if (!(Test-Path $evidencePath)) { throw "WIN-BUILD-ALLOCATION-001: Release Security allocation evidence is required" }
          python src/verify_windows_release_security_allocation.py release_binding/LINE自動發訊息_Windows.pyw release_binding/BOUND_SOURCE_MANIFEST.json $evidencePath

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyautogui pyperclip Pillow pyinstaller

      - name: Pre-build safety checks
        shell: pwsh
        run: |
          python -m py_compile release_binding/LINE自動發訊息_Windows.pyw release_binding/gsheet_helper.py
          python src/verify_windows_no_send_preflight.py release_binding/LINE自動發訊息_Windows.pyw release_binding/gsheet_helper.py
          $source = Get-Content -Raw "release_binding/LINE自動發訊息_Windows.pyw"
          $helper = Get-Content -Raw "src/gsheet_helper.py"
          foreach ($token in @("ORIKAN_TX_2024", "script.google.com/macros", "verify_license", "PERMANENT-*", "SUB-*")) {
            if ($source.Contains($token) -or $helper.Contains($token)) { throw "Forbidden legacy or offline-auth token: $token" }
          }
          if (Test-Path "src/gsheet_config.json") { throw "gsheet_config.json must not be packaged" }
          if (Test-Path "src/license.json") { throw "license.json must not be packaged" }

      - name: Build EXE
        shell: pwsh
        run: |
          cd release_binding
          pyinstaller --onefile --windowed --name "LINE_AutoSender" --clean --noconfirm "LINE自動發訊息_Windows.pyw"
          Copy-Item "LINE自動發訊息_Windows.pyw" "LINE自動發訊息_Windows_self_test.py"
          if ((Get-FileHash "LINE自動發訊息_Windows.pyw" -Algorithm SHA256).Hash -ne (Get-FileHash "LINE自動發訊息_Windows_self_test.py" -Algorithm SHA256).Hash) { throw "Self-test source copy does not match candidate source" }
          pyinstaller --onefile --console --name "LINE_AutoSenderSelfTest" --clean --noconfirm "LINE自動發訊息_Windows_self_test.py"
          Remove-Item "LINE自動發訊息_Windows_self_test.py" -Force

      - name: EXE self-test (no send)
        shell: pwsh
        run: |
          $env:LINE_SELF_TEST_REPORT = (Join-Path (Get-Location) "windows_exe_no_send_self_test.json")
          & "release_binding/dist/LINE_AutoSenderSelfTest.exe" "--self-test-no-send"
          $selfTestExitCode = $LASTEXITCODE
          if (Test-Path $env:LINE_SELF_TEST_REPORT) { Get-Content -Raw $env:LINE_SELF_TEST_REPORT }
          if ($selfTestExitCode -ne 0) { throw "Windows EXE no-send self-test failed" }
          $report = Get-Content -Raw $env:LINE_SELF_TEST_REPORT | ConvertFrom-Json
          if ($report.overall -ne "PASS" -or $report.real_data -ne $false -or $report.line_ui_opened -ne $false -or $report.keyboard_or_clipboard_used -ne $false -or @($report.external_actions).Count -ne 0) {
            throw "Windows EXE self-test report violates no-send boundary"
          }
          Remove-Item "release_binding/dist/LINE_AutoSenderSelfTest.exe" -Force

      - name: Create private candidate archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "private_candidate/LINE自動發訊息_Windows候選版" | Out-Null
          Copy-Item "release_binding/dist/LINE_AutoSender.exe" "private_candidate/LINE自動發訊息_Windows候選版/LINE_AutoSender.exe"
          if (Test-Path "Windows使用說明書.pdf") {
            Copy-Item "Windows使用說明書.pdf" "private_candidate/LINE自動發訊息_Windows候選版/Windows使用說明書.pdf"
          } else {
            Write-Host "Windows使用說明書.pdf not present; keeping the private candidate artifact source-only."
          }
          python src/create_windows_private_candidate_evidence.py `
            --release-id $env:RELEASE_ID `
            --binding-manifest "release_binding/BOUND_SOURCE_MANIFEST.json" `
            --bound-source "release_binding/LINE自動發訊息_Windows.pyw" `
            --helper "release_binding/gsheet_helper.py" `
            --exe "private_candidate/LINE自動發訊息_Windows候選版/LINE_AutoSender.exe" `
            --self-test-report "windows_exe_no_send_self_test.json" `
            --sbom-output "private_candidate/LINE自動發訊息_Windows候選版/SBOM.cdx.json" `
            --manifest-output "private_candidate/LINE自動發訊息_Windows候選版/CANDIDATE_MANIFEST.json"
          Compress-Archive -Path "private_candidate/LINE自動發訊息_Windows候選版" -DestinationPath "LINE自動發訊息_Windows候選版.zip" -Force
          python src/finalize_windows_private_candidate_evidence.py `
            --manifest "private_candidate/LINE自動發訊息_Windows候選版/CANDIDATE_MANIFEST.json" `
            --sbom "private_candidate/LINE自動發訊息_Windows候選版/SBOM.cdx.json" `
            --exe "private_candidate/LINE自動發訊息_Windows候選版/LINE_AutoSender.exe" `
            --package "LINE自動發訊息_Windows候選版.zip" `
            --output "WINDOWS_PRIVATE_CANDIDATE_EVIDENCE.json"

      - name: Verify package
        shell: pwsh
        run: |
          if (!(Test-Path "release_binding/dist/LINE_AutoSender.exe")) { throw "EXE not found" }
          if (!(Test-Path "LINE自動發訊息_Windows候選版.zip")) { throw "Candidate archive not found" }
          if (!(Test-Path "private_candidate/LINE自動發訊息_Windows候選版/CANDIDATE_MANIFEST.json")) { throw "Candidate manifest not found" }
          if (!(Test-Path "private_candidate/LINE自動發訊息_Windows候選版/SBOM.cdx.json")) { throw "Candidate SBOM not found" }
          if (!(Test-Path "WINDOWS_PRIVATE_CANDIDATE_EVIDENCE.json")) { throw "Candidate outer evidence not found" }
          $manifest = Get-Content -Raw "private_candidate/LINE自動發訊息_Windows候選版/CANDIDATE_MANIFEST.json" | ConvertFrom-Json
          if ($manifest.status -ne "PRIVATE_UNSIGNED_CANDIDATE_NOT_FOR_DELIVERY") { throw "Candidate status is not private" }
          if ($manifest.app_id -ne "line_automation_windows" -or $manifest.client_id -ne "deal_alliance_line_windows" -or $manifest.release_id -ne "DA-LINE-WINDOWS-20260717-8000" -or $manifest.pkce -ne "S256") { throw "Candidate OAuth V2 binding is incomplete" }
          if ($manifest.gates.formal_registry_allowed -ne $false -or $manifest.gates.customer_delivery_allowed -ne $false -or $manifest.gates.protected_download_allowed -ne $false) { throw "Candidate delivery gate is not closed" }
          $candidate = "private_candidate/LINE自動發訊息_Windows候選版"
          $candidateRoot = (Resolve-Path $candidate).Path
          $allowedNames = @("LINE_AutoSender.exe", "CANDIDATE_MANIFEST.json", "SBOM.cdx.json", "Windows使用說明書.pdf")
          $candidateNames = Get-ChildItem -File -Recurse $candidateRoot | ForEach-Object { $_.FullName.Substring($candidateRoot.Length + 1).Replace('\', '/') }
          foreach ($name in $candidateNames) {
            if ($name -notin $allowedNames) { throw "Unexpected candidate package file: $name" }
          }
          if ("LINE_AutoSender.exe" -notin $candidateNames -or "CANDIDATE_MANIFEST.json" -notin $candidateNames -or "SBOM.cdx.json" -notin $candidateNames) { throw "Candidate package is incomplete" }
          $exeHash = (Get-FileHash "$candidate/LINE_AutoSender.exe" -Algorithm SHA256).Hash.ToLower()
          if ($manifest.hashes.binary_sha256 -ne $exeHash) { throw "EXE hash does not match manifest" }
          $signature = Get-AuthenticodeSignature "$candidate/LINE_AutoSender.exe"
          if ($signature.Status -ne "NotSigned") { throw "Private candidate must not claim formal Authenticode signing: $($signature.Status)" }
          Expand-Archive -Path "LINE自動發訊息_Windows候選版.zip" -DestinationPath "package_probe" -Force
          $probeRoot = "package_probe/LINE自動發訊息_Windows候選版"
          $probeNames = Get-ChildItem -File -Recurse $probeRoot | ForEach-Object { $_.FullName.Substring((Resolve-Path $probeRoot).Path.Length + 1).Replace('\', '/') }
          if ((Compare-Object $candidateNames $probeNames)) { throw "ZIP content differs from candidate directory" }
          $probeManifest = Get-Content -Raw "$probeRoot/CANDIDATE_MANIFEST.json" | ConvertFrom-Json
          if ($probeManifest.status -ne "PRIVATE_UNSIGNED_CANDIDATE_NOT_FOR_DELIVERY" -or $probeManifest.gates.formal_registry_allowed -ne $false -or $probeManifest.gates.customer_delivery_allowed -ne $false -or $probeManifest.gates.protected_download_allowed -ne $false) { throw "Expanded candidate manifest opens the delivery gate" }
          $probeExeHash = (Get-FileHash "$probeRoot/LINE_AutoSender.exe" -Algorithm SHA256).Hash.ToLower()
          if ($probeManifest.hashes.binary_sha256 -ne $probeExeHash -or $manifest.hashes.binary_sha256 -ne $probeExeHash) { throw "Expanded candidate EXE hash does not match manifest" }
          python src/verify_windows_private_candidate_artifacts.py `
            --manifest "$candidate/CANDIDATE_MANIFEST.json" `
            --sbom "$candidate/SBOM.cdx.json" `
            --exe "$candidate/LINE_AutoSender.exe" `
            --package "LINE自動發訊息_Windows候選版.zip" `
            --final-evidence "WINDOWS_PRIVATE_CANDIDATE_EVIDENCE.json"
          Get-ChildItem $candidate

      - name: Upload private candidate archive
        uses: actions/upload-artifact@v4
        with:
          name: LINE自動發訊息_Windows候選版
          path: |
            LINE自動發訊息_Windows候選版.zip
            WINDOWS_PRIVATE_CANDIDATE_EVIDENCE.json
