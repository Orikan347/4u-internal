name: Build LINE Auto Sender Windows EXE

on:
  push:
    branches:
      - line-autosender-windows-build
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyautogui pyperclip Pillow pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          cd src
          pyinstaller --onefile --windowed --name "LINE_AutoSender" --add-data "gsheet_helper.py;." --add-data "gsheet_config.json;." --clean --noconfirm "line_auto_sender_windows.pyw"

      - name: Create final customer package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "final_package/LINE自動發訊息_Windows正式客戶版" | Out-Null
          Copy-Item "src/dist/LINE_AutoSender.exe" "final_package/LINE自動發訊息_Windows正式客戶版/LINE_AutoSender.exe"
          Copy-Item "Windows使用說明書.pdf" "final_package/LINE自動發訊息_Windows正式客戶版/Windows使用說明書.pdf"
          Compress-Archive -Path "final_package/LINE自動發訊息_Windows正式客戶版" -DestinationPath "LINE自動發訊息_Windows正式客戶版.zip" -Force

      - name: Verify package
        shell: pwsh
        run: |
          if (!(Test-Path "src/dist/LINE_AutoSender.exe")) { throw "EXE not found" }
          if (!(Test-Path "LINE自動發訊息_Windows正式客戶版.zip")) { throw "Final package not found" }
          Get-ChildItem "final_package/LINE自動發訊息_Windows正式客戶版"

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: LINE自動發訊息_Windows正式客戶版
          path: LINE自動發訊息_Windows正式客戶版.zip

      - name: Upload exe only
        uses: actions/upload-artifact@v4
        with:
          name: LINE_AutoSender_exe_only
          path: src/dist/LINE_AutoSender.exe
